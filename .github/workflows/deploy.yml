# dev·main 으로의 PR 과 push: 이미지를 빌드하고 prod 프로필로 뜨는지(/actuator/health) 확인한다.
# main push: GHCR 에 올리고 EC2 에서 새 이미지로 교체한다. (Gradle 테스트는 ci.yml)
#
# Secrets: SSH_HOST (Elastic IP), SSH_USER (ubuntu), SSH_KEY (공개키가 서버 ~/.ssh/authorized_keys 에 있는 개인키).
# 비밀값은 서버 ~/lovablepet-spring/.env 에만 있다. 서버 1회 준비는 README 의 "배포" 참고.
name: CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    name: Build & Smoke test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker network create smoke
          docker run -d --name smoke-db --network smoke \
            -e POSTGRES_DB=lovablepet -e POSTGRES_USER=lovablepet -e POSTGRES_PASSWORD=smoke \
            --health-cmd "pg_isready -U lovablepet -d lovablepet" --health-interval 2s \
            pgvector/pgvector:pg16
          timeout 60 sh -c 'until [ "$(docker inspect -f "{{.State.Health.Status}}" smoke-db)" = healthy ]; do sleep 2; done'

          # 운영 .env 와 같은 변수 이름에 가짜 값 (deploy/.env.example, deploy/docker-compose.yml)
          docker run -d --name smoke --network smoke -p 8080:8080 \
            -e DB_URL=jdbc:postgresql://smoke-db:5432/lovablepet -e DB_USERNAME=lovablepet -e DB_PASSWORD=smoke \
            -e PET_PIPELINE_BASE_URL=http://pipeline:8000 -e PET_PIPELINE_API_KEY=smoke \
            -e PET_PIPELINE_CALLBACK_URL=http://spring:8080/internal/pet-models/callback \
            -e JWT_SECRET="$(openssl rand -base64 32)" -e TOKEN_HASH_SECRET=smoke \
            -e ACCESS_TOKEN_EXPIRATION=1800000 -e REFRESH_TOKEN_EXPIRATION=1209600000 \
            -e KAKAO_REST_API_KEY= -e KAKAO_CLIENT_SECRET= -e KAKAO_REDIRECT_URI= \
            -e CORS_ALLOWED_ORIGINS=http://localhost:5173 -e SWAGGER_ENABLED=true \
            "$IMAGE:${{ github.sha }}"
          curl -fsS --retry 30 --retry-delay 2 --retry-all-errors localhost:8080/actuator/health

          # Swagger 문서가 만들어지는지, 앱이 부르지 않는 내부 콜백은 문서에서 빠졌는지
          curl -fsS localhost:8080/v3/api-docs -o "$RUNNER_TEMP/api-docs.json"
          grep -q '"/api/auth/login"' "$RUNNER_TEMP/api-docs.json"
          if grep -q '/internal/' "$RUNNER_TEMP/api-docs.json"; then
            echo "내부 콜백 경로가 Swagger 문서에 노출됐다"; exit 1
          fi
          curl -fsS -o /dev/null localhost:8080/swagger-ui/index.html

          # 콜백 경로가 JWT 인증에 막히지 않고 컨트롤러의 키 검사까지 오는지 (Security 에서 막히면 COMMON_401)
          curl -sS -X POST localhost:8080/internal/pet-models/callback \
            -H 'Content-Type: application/json' -d '{}' | grep -q GENERATION_401_KEY

          # 관리자 API: 토큰이 없으면 COMMON_401, 가입한 일반 회원(role USER)의 토큰이면 COMMON_403
          curl -sS localhost:8080/api/admin/ping | grep -q '"COMMON_401"'
          signup=$(curl -fsS -X POST localhost:8080/api/auth/signup -H 'Content-Type: application/json' \
            -d '{"username":"smoke_user","email":"smoke@example.com","password":"password1234","nickname":"smoke"}')
          [ "$(echo "$signup" | jq -r .success.data.role)" = USER ]
          token=$(echo "$signup" | jq -r .success.data.accessToken)
          curl -sS localhost:8080/api/admin/ping -H "Authorization: Bearer $token" | grep -q '"COMMON_403"'

          # 자동 생성 보안 비밀번호가 기동 로그에 남지 않는지
          if docker logs smoke 2>&1 | grep -q "generated security password"; then
            echo "기동 로그에 자동 생성 비밀번호가 있다 (UserDetailsServiceAutoConfiguration)"; exit 1
          fi
          docker rm -f smoke smoke-db

      - name: Smoke test logs
        if: failure()
        run: docker logs smoke || true

      - name: Push to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

  deploy:
    name: Deploy to EC2
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Copy compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: deploy/docker-compose.yml
          target: lovablepet-spring      # SSH 사용자 홈 기준 상대 경로
          strip_components: 1

      - name: Pull and restart
        uses: appleboy/ssh-action@v1.2.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: GH_TOKEN,GH_ACTOR,REPO,SHA
          script: |
            set -e
            cd ~/lovablepet-spring
            [ -f .env ] || { echo "~/lovablepet-spring/.env is missing (see README)"; exit 1; }
            docker network create lovablepet 2>/dev/null || true

            echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
            export SPRING_IMAGE="ghcr.io/${REPO,,}:$SHA"
            docker compose pull
            docker compose up -d --remove-orphans
            docker logout ghcr.io
            docker image prune -f
            curl -fsS --retry 30 --retry-delay 2 --retry-all-errors localhost:8080/actuator/health \
              || { docker logs --tail 100 spring; exit 1; }

            # 배포마다 커밋 해시 태그 이미지가 하나씩 남는다(prune -f 는 태그 없는 이미지만 지움).
            # 새 컨테이너가 정상으로 뜬 뒤, 컨테이너가 쓰지 않는 이 저장소 이미지만 지운다 (파이프라인·postgres 는 라벨이 달라 남는다)
            docker image prune -af --filter "label=org.opencontainers.image.source=https://github.com/$REPO"

            # 서버에서 직접 docker compose 를 실행하면 SPRING_IMAGE 가 없어 :latest 를 찾는다.
            # GHCR 은 private 이라 로그인 없이 받을 수 없으므로 실행 중인 이미지에 latest 태그를 로컬로 붙여 둔다.
            # 위 정리보다 뒤에 둔다: 서버의 containerd 이미지 저장소는 태그를 각각 따로 다뤄서,
            # 컨테이너가 쓰지 않는 latest 태그도 정리 대상이 된다
            docker tag "$SPRING_IMAGE" "ghcr.io/${REPO,,}:latest"
