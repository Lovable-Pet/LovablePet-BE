# 운영 프로파일 — 민감정보는 기본값 없이 환경변수로만 주입한다.
# 값이 누락되면 애플리케이션이 기동 실패하도록 의도적으로 기본값을 두지 않았다.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false

petgen:
  base-url: ${PETGEN_BASE_URL}
  token: ${PETGEN_TOKEN}
  callback-url: ${PETGEN_CALLBACK_URL}

storage:
  root: ${STORAGE_ROOT:/data/storage}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

kakao:
  oauth:
    client-id: ${KAKAO_REST_API_KEY}
    client-secret: ${KAKAO_CLIENT_SECRET}
    redirect-uri: ${KAKAO_REDIRECT_URI}
    auth-base-url: https://kauth.kakao.com
    api-base-url: https://kapi.kakao.com
    connect-timeout: 5s
    read-timeout: 10s

management:
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}

logging:
  level:
    root: INFO
    com.lovablepet: INFO

app:
  auth:
    jwt-secret: ${JWT_SECRET}
    token-hash-secret: ${TOKEN_HASH_SECRET}

    access-token-expiration: ${ACCESS_TOKEN_EXPIRATION}
    refresh-token-expiration: ${REFRESH_TOKEN_EXPIRATION}
