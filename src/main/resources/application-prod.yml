# 운영 프로파일 — 민감정보는 기본값 없이 환경변수로만 주입한다.
# 값이 누락되면 애플리케이션이 기동 실패하도록 의도적으로 기본값을 두지 않았다.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false

petgen:
  base-url: ${PETGEN_BASE_URL}
  token: ${PETGEN_TOKEN}
  callback-url: ${PETGEN_CALLBACK_URL}

storage:
  root: ${STORAGE_ROOT:/data/storage}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

management:
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}

logging:
  level:
    root: INFO
    com.lovablepet: INFO
