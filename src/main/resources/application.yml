# 공통 설정 — 모든 값은 환경변수로 덮어쓸 수 있고, 기본값은 로컬 개발용이다.
# 실제 비밀값(운영 DB 비밀번호, 토큰 등)은 절대 이 파일에 적지 말 것.
spring:
  application:
    name: lovable-pet-backend
  profiles:
    active: local   # SPRING_PROFILES_ACTIVE 환경변수로 덮어씀 (운영: prod)

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lovablepet}
    username: ${DB_USERNAME:lovablepet}
    password: ${DB_PASSWORD:lovablepet}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # 스키마는 Flyway가 관리한다. update/create 금지.
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 25MB

server:
  port: ${SERVER_PORT:8080}

# Python 3D 생성(AI) 서버 연동
petgen:
  base-url: ${PETGEN_BASE_URL:http://localhost:8000}
  token: ${PETGEN_TOKEN:local-dev-token}
  callback-url: ${PETGEN_CALLBACK_URL:http://localhost:8080/api/generation/webhook}
  connect-timeout: ${PETGEN_CONNECT_TIMEOUT:5s}
  read-timeout: ${PETGEN_READ_TIMEOUT:30s}

# 업로드 파일 저장 루트 (로컬 구현용, 추후 S3로 교체 예정)
storage:
  root: ${STORAGE_ROOT:./storage}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized
