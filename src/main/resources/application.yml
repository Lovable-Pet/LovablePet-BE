# 공통 설정 — 모든 값은 환경변수로 덮어쓸 수 있고, 기본값은 로컬 개발용이다.
# 실제 비밀값(운영 DB 비밀번호, 토큰 등)은 절대 이 파일에 적지 말 것.
spring:
  application:
    name: lovable-pet-backend
  profiles:
    active: local   # SPRING_PROFILES_ACTIVE 환경변수로 덮어씀 (운영: prod)

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lovablepet}
    username: ${DB_USERNAME:lovablepet}
    password: ${DB_PASSWORD:lovablepet}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # 스키마는 Flyway가 관리한다. update/create 금지.
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 25MB

server:
  port: ${SERVER_PORT:8080}

# Python 3D 생성(AI) 파이프라인 연동 (계약: LovablePet-AI-AR 저장소 docs/API.md)
pet-pipeline:
  base-url: ${PET_PIPELINE_BASE_URL:http://localhost:8000}
  api-key: ${PET_PIPELINE_API_KEY:local-dev-key}
  callback-url: ${PET_PIPELINE_CALLBACK_URL:http://localhost:8080/internal/pet-models/callback}
  model-dir: ${PET_PIPELINE_MODEL_DIR:./storage/models}   # 콜백으로 받은 GLB 를 저장하는 폴더
  connect-timeout: ${PET_PIPELINE_CONNECT_TIMEOUT:10s}
  read-timeout: ${PET_PIPELINE_READ_TIMEOUT:90s}       # 배포 직후 첫 적합도 확인은 30초 넘게 걸린다. 줄이지 말 것
  scripted: ${PET_PIPELINE_SCRIPTED:}                  # 비용 없는 대본 실행(예: black_shiba). 연동 시험용, 운영에서는 비워 둔다
  daily-limit: ${PET_PIPELINE_DAILY_LIMIT:30}          # 하루(한국 날짜) AR 생성 시도 상한

# 공공데이터포털 구조동물 조회 서비스 (농림축산검역본부) — 유기견을 매주 월요일 pet 테이블로 동기화한다
public-animal:
  base-url: https://apis.data.go.kr/1543061/abandonmentPublicService_v2
  service-key: ${DATA_GO_KR_SERVICE_KEY:}   # 비어 있으면 동기화를 건너뛴다 (로컬·CI)
  page-size: 1000                            # API 최대값
  connect-timeout: 10s
  read-timeout: 60s

# 업로드 파일 저장 루트 (로컬 구현용, 추후 S3로 교체 예정)
storage:
  root: ${STORAGE_ROOT:./storage}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

kakao:
  oauth:
    client-id: ${KAKAO_REST_API_KEY:}
    client-secret: ${KAKAO_CLIENT_SECRET:}
    redirect-uri: ${KAKAO_REDIRECT_URI:}
    auth-base-url: https://kauth.kakao.com
    api-base-url: https://kapi.kakao.com
    connect-timeout: 5s
    read-timeout: 10s

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized
app:
  auth:
    # JWT 서명용 시크릿 키 (운영에서는 반드시 JWT_SECRET 환경변수로 32바이트 이상 난수 주입)
    jwt-secret: ${JWT_SECRET:v/Z5Y1B/L8xXbK2G7zUeT9aR3vC5bN8xQ2W1yM4kZ6U=}

    # 리프레시 토큰 해싱용 시크릿 키
    token-hash-secret: ${TOKEN_HASH_SECRET:random-hash-secret-key-1234567890}

    # 토큰 만료 시간 (밀리초 단위) - 필요시 운영에서 시간 단축/연장 가능
    access-token-expiration: ${ACCESS_TOKEN_EXPIRATION:1800000} # 기본 30분
    refresh-token-expiration: ${REFRESH_TOKEN_EXPIRATION:1209600000} # 기본 14일
