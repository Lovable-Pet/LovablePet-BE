# 로컬 개발용 DB — pgvector 확장이 포함된 PostgreSQL 16
# 실행: docker compose up -d   (값은 .env 또는 셸 환경변수로 덮어쓸 수 있음)
name: lovable-pet

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: lovablepet-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-lovablepet}
      POSTGRES_USER: ${DB_USERNAME:-lovablepet}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-lovablepet}
      TZ: UTC
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    labels:
      org.springframework.boot.service-connection: postgres

volumes:
  postgres-data:
