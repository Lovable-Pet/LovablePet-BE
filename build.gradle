plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.lovablepet'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Web / Validation
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    // Python AI 서버 호출용 RestClient (Boot 4부터 RestClient.Builder 자동설정이 별도 모듈 — WebFlux 미사용)
    implementation 'org.springframework.boot:spring-boot-starter-restclient'

    // Persistence
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    // Boot 4부터 Flyway 자동설정은 전용 스타터가 필요 (flyway-core 포함)
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    // API docs / Ops  (springdoc 3.x = Boot 4 대응 라인)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

// 실행 가능한 bootJar만 생성 (plain jar 생략 → Dockerfile에서 jar 경로가 하나로 고정됨)
tasks.named('jar') {
    enabled = false
}
